name: Feature Request · 功能建议
description: 建议新增分诊规则、UI 筛选维度或工程改进
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题 / Problem or Pain Point
      description: 描述在协作调度或 PR 分诊中遇到的具体痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 简述希望新增的规则、视图或端点字段
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围评估 / Architecture Impact
      description: 是否保持纯静态零后端与无浏览器直连 GitHub API 约束？
