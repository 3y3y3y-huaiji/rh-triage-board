name: Smoke · 线上巡检
run-name: Smoke · ${{ inputs.origin || 'pages.dev' }}

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 目标站点源
        required: false
        default: https://rh-triage-board.pages.dev
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: 线上首页与数据快照巡检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: 探测首页与 /data/board.json
        env:
          RH_BOARD_ORIGIN: ${{ inputs.origin || vars.RH_BOARD_ORIGIN || 'https://rh-triage-board.pages.dev' }}
        run: node scripts/smoke.mjs
