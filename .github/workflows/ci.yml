name: CI · 应用
run-name: CI · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: '可选 diff 基线 ref / SHA'
        required: false
        default: ''
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 变更分类
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      workflows: ${{ steps.detect.outputs.workflows }}
      workflows_only: ${{ steps.detect.outputs.workflows_only }}
      static: ${{ steps.detect.outputs.static }}
      test: ${{ steps.detect.outputs.test }}
      build: ${{ steps.detect.outputs.build }}
      e2e: ${{ steps.detect.outputs.e2e }}
      deps: ${{ steps.detect.outputs.deps }}
      deployable: ${{ steps.detect.outputs.deployable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 分类改动
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.event.inputs.base }}
        run: node scripts/detect-changes.mjs --base "$BASE"

  docs-check:
    name: 文档不变量检查
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: 文档不变量校验
        run: node scripts/verify-docs.mjs

  actionlint:
    name: Actions 工作流静态检查
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  static:
    name: 静态检查
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run verify:docs

  test:
    name: 单元测试
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 构建产物
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build
      - run: pnpm run verify:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: 浏览器端到端
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - name: Playwright UI 契约验证
        env:
          RH_E2E_CHANNEL: chrome
        run: pnpm run e2e

  audit:
    name: 依赖审计
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high

  # 分支保护仅绑定单个稳定 required check；内部按改动分档跳过部分 job 时，
  # 由该聚合门禁统一对外汇报通过与否。
  ci-gate:
    name: CI 门禁
    needs: [changes, docs-check, actionlint, static, test, build, e2e, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总门禁结果
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs-check.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "changes=$CHANGES docs=$DOCS actionlint=$ACTIONLINT static=$STATIC test=$TEST build=$BUILD e2e=$E2E audit=$AUDIT"
          case "$CHANGES $DOCS $ACTIONLINT $STATIC $TEST $BUILD $E2E $AUDIT" in
            *failure*|*cancelled*) echo "CI 门禁未通过"; exit 1 ;;
          esac
          echo "CI 门禁通过（未触发的分档为 skipped）"
